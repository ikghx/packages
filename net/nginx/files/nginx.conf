# 指定运行 Nginx 的用户，为了安全建议使用非特权用户。
user ftp;
# 指定 nginx 的运行进程数量，一般建议小于或等于 CPU 核心数，设为 auto 则自动检测并使用和核心数一样的进程数量。
worker_processes auto;
# 错误日志路径。
error_log /var/log/nginx/error.log;
# 运行时的 PID 文件路径。
pid /var/run/nginx.pid;
# 设置工作进程的最大打开文件数限制。
worker_rlimit_nofile 1024;
# 载入 Nginx 动态模块。
include module.d/*.module;

events {
        # 工作进程将一次接受所有新连接。
        multi_accept on;
        # 设置单个进程最大连接数量，根据硬件性能进行调整，最大不能超过系统文件句柄数限制。
        # 使用 ulimit -n 查询当前系统的文件句柄数限制。
        worker_connections 1024;
}


http {
      # 文件扩展名与文件类型映射表，用于告知浏览器文件的类型，以便浏览器执行正确的操作。
      include       mime.types;
      # 加载 NAXSI 应用防火墙核心规则。
      #include       naxsi_core.rules;
      # 默认的文件类型，当浏览器打开文件类型映射表中没有的文件格式，将按照此处参数标识文件类型，默认标识为可下载文件。
      default_type  application/octet-stream;

      # 自定义日志文件格式。
      #log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
      #                  '$status $body_bytes_sent "$http_referer" '
      #                  '"$http_user_agent" "$http_x_forwarded_for"';

      # 通用基本参数。
      access_log     off; # 是否启用访问日志。
      #access_log     /var/log/nginx/access.log main buffer=64k flush=1m; # 访问日志，用于记录详细的网站访问历史。
      #open_log_file_cache max=1000 inactive=10s valid=1m min_uses=1; # 日志文件缓存。
      charset        utf-8; # 指定 Nginx 默认的字符集，解决中文显示乱码，文档内容也需要使用 utf-8 编码才能正常在浏览器内显示。
      server_tokens  off; # 隐藏 Nginx 的版本号。
      types_hash_max_size 2048; # 哈希表的最大值（字节），Nginx 使用哈希表来存储 MIME type 与文件扩展名。

      sendfile       on; # 开启文件高效传输模式，当作为反向代理时应将此项改为 off
      tcp_nopush     on; # 在一个数据包里发送所有头文件，sendfile 选项开启时此选项才有效。
      tcp_nodelay    on; # 当连接转换为保持活动状态时，将启用该选项，SSL 连接，无缓冲代理和 WebSocket 代理也应启用。

      # 客户端访问参数。
      reset_timedout_connection on; # 服务端在客户端停止发送应答之后关闭连接，当有大量并发需求时建议打开。

      # fastcgi 调优。
      fastcgi_connect_timeout 600s; # 连接到后端 FastCGI 的超时时间。
      fastcgi_send_timeout 600s; # 向 FastCGI 发送请求的超时时间。
      fastcgi_read_timeout 600s; # 接收 FastCGI 应答的超时时间。

      # 开启 gzip 文件压缩模块，以提升页面加载速度，HTTP 文件服务器则应该禁用 gzip 模块。
      gzip on;
      gzip_vary on;
      gzip_comp_level 4;
      gzip_min_length 256;
      gzip_proxied expired no-cache no-store private no_last_modified no_etag auth;
      gzip_types application/atom+xml text/javascript application/javascript application/json application/ld+json application/manifest+json application/rss+xml application/vnd.geo+json application/vnd.ms-fontobject application/wasm application/x-font-ttf application/x-web-app-manifest+json application/xhtml+xml application/xml font/opentype image/bmp image/svg+xml image/x-icon text/cache-manifest text/css text/plain text/vcard text/vnd.rim.location.xloc text/vtt text/x-component text/x-cross-domain-policy;

      # 开启 Brotli 文件压缩模块，功能同 gzip，压缩效果更好，可共存，根据浏览器支持与否自动选择。
      brotli on; # 开启或关闭 Brotli 模块。
      brotli_min_length 256; # 低于此大小的资源不压缩。
      brotli_comp_level 6; # 压缩级别 0-11，越大压缩率越高，同时消耗 cpu 资源也越多。
      brotli_types application/atom+xml text/javascript application/javascript application/json application/ld+json application/manifest+json application/rss+xml application/vnd.geo+json application/vnd.ms-fontobject application/wasm application/x-font-ttf application/x-web-app-manifest+json application/xhtml+xml application/xml font/opentype image/bmp image/svg+xml image/x-icon text/cache-manifest text/css text/plain text/vcard text/vnd.rim.location.xloc text/vtt text/x-component text/x-cross-domain-policy;

      include /etc/nginx/conf.d/*.conf; # 加载所有配置文件，请确认所有配置文件参数正确且无冲突，否则会导致 Nginx 无法运行。
}
